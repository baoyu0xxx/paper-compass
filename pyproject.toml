[project]
name = "paper-compass"
version = "0.1.0"
description = "Personal academic paper retrieval and knowledge navigation infrastructure"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "paper-qa>=5",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
