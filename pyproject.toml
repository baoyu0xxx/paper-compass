[project]
name = "paper-compass"
version = "1.3.0"
description = "Personal academic paper retrieval and knowledge navigation infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "baoyu0xxx" }
]
keywords = ["zotero", "rag", "mcp", "research", "academic-papers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pyyaml>=6.0",
  "chromadb>=0.4.0",
  "pymupdf>=1.22.0",
  "rank-bm25>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/baoyu0xxx/paper-compass"
Repository = "https://github.com/baoyu0xxx/paper-compass"
Issues = "https://github.com/baoyu0xxx/paper-compass/issues"

[project.scripts]
paper-compass = "paper_compass.cli:main"
paper-compass-healthcheck = "paper_compass.healthcheck:main"
paper-compass-mcp = "paper_compass.mcp_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2.2",
  "twine>=5.1.1",
]
local-embed = [
  "sentence-transformers>=2.2.0",
]
pdf-fallback = [
  "pdfplumber>=0.7.0",
]
full = [
  "sentence-transformers>=2.2.0",
  "pdfplumber>=0.7.0",
]
paperqa = [
  "paper-qa>=5",
  "pydantic>=2.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
paper_compass = [
  "configs/*.yaml",
  "prompts/*.md",
  "prompts/disciplines/*/*.md",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
