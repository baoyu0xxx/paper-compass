version: 1

default_provider: wiki_generation

providers:
  wiki_generation:
    api_style: openai-compatible
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    model_env: LLM_MODEL
    temperature: 0.1
    max_tokens: 4000
    timeout_seconds: 120

  # Alibaba Cloud Bailian (Qwen, OpenAI-compatible)
  embedding_main:
    provider: openai
    display_name: aliyun
    api_style: openai-compatible
    base_url_env: EMBED_BASE_URL
    api_key_env: EMBED_API_KEY
    model: qwen3.7-text-embedding-flash
    model_env: EMBED_MODEL
    dimension: 1024
    timeout_seconds: 120

  # Volcengine (explicit alternative)
  embedding_volcengine:
    provider: volcengine
    api_style: openai-compatible
    base_url_env: VOLC_EMBED_BASE_URL
    api_key_env: VOLC_EMBED_API_KEY
    model_env: VOLC_EMBED_MODEL
    dimension: 2048
    timeout_seconds: 120


roles:
  wiki_ingest: wiki_generation
  wiki_query: wiki_generation
  router_classify: wiki_generation
  embedding: embedding_main
