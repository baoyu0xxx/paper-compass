version: 1

wiki:
  enabled: true
  ingest_mode: curated
  auto_writeback: false
  allow_manual_writeback: true

  llm_role: wiki_ingest
  query_llm_role: wiki_query
  embedding_role: wiki_embedding

  page_types:
    - papers
    - topics
    - methods
    - queries
    - comparisons

  query:
    default_limit: 5
    return_snippets: true
    max_summary_pages: 3
    enable_embedding_search: true

  writeback:
    default_target_type: queries
    require_sources: true
    require_confidence: true
    update_index: true
    update_log: true

  frontmatter:
    required_fields:
      - title
      - created
      - updated
      - type
      - tags
      - sources
      - confidence

  prompt_files:
    router: prompts/wiki_router.md
    ingest: prompts/wiki_ingest.md
    query: prompts/wiki_query.md
    merge: prompts/wiki_merge.md
    # wiki_overview.md and wiki_empirical.md are resolved dynamically
    # based on WIKI_PROMPT env var (default, economics, or custom path).

  wiki_prompt:
    mode: env
    env_var: WIKI_PROMPT
    presets:
      - default
      - economics
    custom: true
    description: |
      Controls which prompt set is used for wiki page generation.
      Set WIKI_PROMPT in .env or pass --wiki-prompt to `paper-compass init`.
      default   → prompts/wiki_overview.md + wiki_empirical.md (general academic)
      economics → prompts/disciplines/economics/wiki_overview.md + wiki_empirical.md
      <path>    → <path>/wiki_overview.md + <path>/wiki_empirical.md

  confidence_defaults:
    query_writeback: medium
    topic_synthesis: medium
    single_source_note: low
